name: PR Test Build

# MANUAL ONLY: the full build is too large to run on every PR push. Run it from the Actions tab
# ("PR Test Build" -> Run workflow -> PR number) or `gh workflow run pr-build.yml -f pr=<number>`.
# It builds every patch archive in build/manifest.json from the PR's head commit and attaches them
# to the PR as a downloadable GitHub Actions artifact + a sticky comment linking to it. Each run
# deletes the previous artifact first; closing/merging the PR deletes it (that cleanup job is the
# only automatic part, and is cheap).
# The main/tag release pipeline lives in build.yml and is unaffected.
# Shared build steps live in the composite action .github/actions/build-mod-archives/.

on:
  pull_request:
    types: [closed]          # cleanup only - the build never runs automatically
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to build'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write   # sticky comment
  actions: write         # delete superseded / merged-PR artifacts

concurrency:
  group: pr-build-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  SPRIGGIT_VERSION: '0.40.0'
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  ARTIFACT_NAME: pr-${{ github.event.pull_request.number || inputs.pr }}-test-builds
  COMMENT_MARKER: '<!-- pr-test-build -->'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head

      - name: Delete previous test-build artifacts for this PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arts = gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" | ConvertFrom-Json
          foreach ($a in ($arts.artifacts | Where-Object { $_.name -eq "$env:ARTIFACT_NAME" })) {
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($a.id)"
            Write-Host "Deleted old artifact $($a.id)"
          }

      - name: Build mod archives
        uses: ./.github/actions/build-mod-archives
        with:
          spriggit-version: ${{ env.SPRIGGIT_VERSION }}
          github-token: ${{ github.token }}

      # An empty build/manifest.json produces no archives. That is a legitimate state (a PR that
      # only touches docs or tooling, or the repo before its first patch), so detect it and skip
      # the upload/comment rather than failing the PR check.
      - name: Check for built archives
        id: archives
        shell: pwsh
        run: |
          $n = @(Get-ChildItem build/dist/*.7z -ErrorAction SilentlyContinue).Count
          "found=$($n -gt 0)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "$n archive(s) built."

      - name: Upload test builds
        if: steps.archives.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/dist/*.7z
          retention-days: 14
          overwrite: true
          if-no-files-found: error

      - name: Post/update sticky PR comment
        if: steps.archives.outputs.found == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl   = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $shortSha = (git rev-parse --short=7 HEAD).Trim()

          $lines = @()
          foreach ($f in Get-ChildItem build/dist/*.7z) {
            $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "- **$($f.Name)** — ``$sha``"
          }

          $body = (@(
            "$env:COMMENT_MARKER"
            "🤖 **Test builds ready for this PR**"
            ""
            "Download the installable mods from the **Artifacts** section of [this workflow run]($runUrl) (requires being signed in to GitHub), then install/enable in your MO2 test list."
            ""
          ) + $lines + @(
            ""
            "> **Before you test, avoid a stale install:**"
            "> - **Check you downloaded _this_ build** — the artifact is deleted and rebuilt on every push, and browsers can serve a cached ``.7z`` of the same name. Confirm the SHA256 of your downloaded file matches the hash above (PowerShell: ``Get-FileHash <file>.7z``)."
            "> - **Reinstall with _Replace_, not _Merge_** — if MO2 offers the choice, pick Replace (or remove the old mod first) so old loose files can't linger. Merge leaves un-overwritten files behind."
            "> - **Watch duplicated scripts** — some ``.pex`` ship in more than one mod; if an older copy in another enabled mod wins the conflict by priority, the game loads the stale script. Update every mod that carries it."
            ""
            "_Built from commit ``$shortSha``. Run the PR Test Build workflow again after new pushes; removed when the PR is merged or closed._"
          )) -join "`n"
          $payload = Join-Path $env:RUNNER_TEMP 'pr-comment.json'
          @{ body = $body } | ConvertTo-Json | Set-Content -Path $payload -Encoding utf8

          $comments = gh api "repos/${{ github.repository }}/issues/$env:PR_NUMBER/comments?per_page=100" | ConvertFrom-Json
          $existing = $comments | Where-Object { $_.body -like "*$env:COMMENT_MARKER*" } | Select-Object -First 1
          if ($existing) {
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$($existing.id)" --input $payload
            Write-Host "Updated comment $($existing.id)"
          } else {
            gh api -X POST "repos/${{ github.repository }}/issues/$env:PR_NUMBER/comments" --input $payload
            Write-Host "Created new comment"
          }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: windows-latest
    steps:
      - name: Delete test-build artifacts for this PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arts = gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" | ConvertFrom-Json
          foreach ($a in ($arts.artifacts | Where-Object { $_.name -eq "$env:ARTIFACT_NAME" })) {
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($a.id)"
            Write-Host "Deleted artifact $($a.id)"
          }

      - name: Update sticky PR comment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @(
            "$env:COMMENT_MARKER"
            "🧹 **Test builds removed** (PR closed). Grab the merged build from the automated release on ``main``."
          ) -join "`n"
          $payload = Join-Path $env:RUNNER_TEMP 'pr-comment.json'
          @{ body = $body } | ConvertTo-Json | Set-Content -Path $payload -Encoding utf8

          $comments = gh api "repos/${{ github.repository }}/issues/$env:PR_NUMBER/comments?per_page=100" | ConvertFrom-Json
          $existing = $comments | Where-Object { $_.body -like "*$env:COMMENT_MARKER*" } | Select-Object -First 1
          if ($existing) {
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$($existing.id)" --input $payload
            Write-Host "Updated comment $($existing.id)"
          } else {
            Write-Host "No sticky comment to update."
          }
