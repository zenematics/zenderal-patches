    - MutagenObjectType: ScriptStringListProperty
      Name: Descriptions
      Data:
      - "When you enter combat, you regenerate Magicka equal to half your Light Magic skill per second. The effect fades over 15 seconds and keeps working while you cast."
      - "Your healing spells also restore as much Stamina as they restore Health."
      - "Your Light Magic heals are up to 30% stronger on targets below half Health; the lower their Health, the bigger the bonus."
      - "In combat, you and nearby allies heal 25 Health every 10 seconds, at a cost of 1% Arcane Fever each time."
      - "Once every 90 seconds, dropping below 25% Health makes you immune to damage for 6 seconds, then heals you for 100 Health at a cost of 4% Arcane Fever."
      - "You reload muskets 30% faster."
      - "Your musket hits deal 10 extra fire damage."
      - "Your musket hits make living targets bleed for 50 damage over 5 seconds."
      - "You move at full speed while aiming a musket."
      - "A musket shot at a target you haven't shot in the last 10 seconds is a critical strike that deals triple critical damage, and its weapon enchantments are twice as strong."
      - "Grants the \"Explosive Tripwire\" power: at will, set a tripwire in front of you that lasts 120 seconds. When tripped, it snaps and knocks everyone it hits to the ground, and an enemy who trips it sets off an explosion that deals 40 damage."
      - "Grants the \"Smokescreen\" power: once a day, create a 35-foot cloud of smoke for 180 seconds and turn invisible for 10 seconds. Those inside the cloud are blinded and cannot see sneaking targets, and your sneak attacks against them deal 50% more damage."
      - "Grants the \"Utility Droid\" power: throw out a mechanical spider that follows you, heals you and staggers enemies around it. It lasts until destroyed, and using the power again calls it back to you. Your first droid is free; each new one costs 10 Spare Parts."
      - "You can build Clockwork Turrets at a forge, and you receive one when you learn this. The \"Clockwork Turret\" power deploys it for 30 seconds: it turns and fires at your target, or the nearest enemy in combat, dealing damage equal to 30% of your Handicraft skill."
      - "Your Clockwork Turret power deploys two turrets side by side, and they fire 2% faster with every shot, up to 200%."
      - "Your unarmed attacks deal extra damage equal to 15% of your current Stamina. Requires both hands to be empty."
      - "Choose a damage type (fire, frost, shock, poison, disease or sun): your unarmed attacks unleash a shockwave that deals it to everyone in front of you. Requires both hands to be empty, and does not trigger while sneaking."
      - "Your unarmed attacks have a 15% chance to stagger enemies, and deal 25% more damage to staggered enemies."
      - "Your unarmed attacks have a 15% chance to land a critical strike that deals damage equal to 40% of your current Stamina. Requires both hands to be empty."
      - "Dodging in combat briefly slows time to a crawl (once every 10 seconds) and releases a Shock Nova that deals 40 shock damage to nearby enemies (once every 15 seconds)."
      - "Grants the \"Seismic Stomp\" power: stomp the ground to send out a shockwave that hurls every enemy within 19 feet into the air and makes them bleed for 50 damage over 5 seconds, while time briefly slows. Usable once every 30 seconds."
      - "While you are at or below half Health, every hit you take restores 20 Stamina."
      - "You gain 25% resistance to fire, frost and lightning."
      - "While 3 or more enemies are near you, you regenerate 2 Stamina per second."
      - "Grants the \"War Banner\" power: plant a banner for 15 seconds. While you stand near it, you heal 20 Health per second, and enemies who come close are bound in chains, as by a Stave of Binding. Usable once every 5 minutes."
      - "Grants the \"Arcane Arsenal\" power: choose Fire, Frost or Lightning, and your bow hits deal 10 extra damage of that element."
      - "While you aim a bow, a Spell Ward (Rank II) surrounds you. It fades when you fire or lower the bow."
      - "Grants the \"Ice Shot\" power: with a bow equipped, add 3 ice arrows to your quiver for 50 Magicka. They deal 25 frost damage and freeze the target solid for 8 seconds, and your next arrow shatters it."
      - "Your bow hits send a barn owl to attack the target. It fights at your side until it is killed, each later hit sends it after that target, and each of its strikes drains 10 Magicka from its target and gives it to you. While it is out, you regenerate 2 Magicka per second. Only one owl can be out at a time."
      - "Grants the \"Arcane Echo\" power: use it while dual casting a spell to store that spell. Your fully drawn bow shots in combat then also release the stored spell toward your crosshair. Only works with spells cast at others."
      - "You can command one more summon for every 25% Arcane Fever you have."
      - "Grants the \"Dark Effigy\" spell (100 Magicka): raise a dark totem for 60 seconds. Your undead summons near it heal 2 Health per second, and you and your allies near it gain 250 armor."
      - "Grants the \"A Willing Sacrifice\" power: every summon you command explodes, dealing damage equal to half its maximum Health to each enemy within 14 feet of it. Usable once every 15 seconds."
      - "A Willing Sacrifice restores 50 Magicka for every enemy it hits."
      - "Grants the \"Legion of the Damned\" power: at the cost of 50% Arcane Fever, raise six skeletons (two warriors, two archers and two mages) that fight at your side for 5 minutes. They do not count against your summon limit, and A Willing Sacrifice can explode them. A new Legion replaces the old one."
