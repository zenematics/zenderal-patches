; Zenderal - NPC Potions
; ----------------------------------------------------------------------------
; Distributes Enderal's restore-health, restore-mana and restore-stamina potions
; plus Ambrosia to humanoid NPCs, level-banded to Enderal's own tier ladder
; (1 / 10 / 18 / 28 / 38 - the same bands as _00ETraderPotion10/20/30).
;
; Supersedes "Zenderal - Enemy Potions.esp", which banded the same three potion
; lines into death-item leveled lists. Disable that mod: SPID puts these in the
; NPC's live inventory instead, so enemies can actually drink them.
;
; Filters on every line:
;   Strings  ActorTypeNPC  - keyword 013794:Skyrim.esm, carried by every
;                            humanoid race in Enderal. Excludes animals,
;                            creatures and the Lost Ones' creature races.
;   Traits   -S/-C/-D      - no summons, no children, no StartsDead props.
;
; FormIDs are 0x<hex>~Skyrim.esm. In Enderal, Skyrim.esm IS base Enderal, and
; every ID below was resolved against reference/base/Skyrim/Ingestibles/.
; Written pre-sanitised (~ not " - ", no spaces around | or ,, no leading
; zeros) so SPID never rewrites this file in place.
; ----------------------------------------------------------------------------

; --- Restore Health: _NNE_Genesungstrank (5 tiers) ---
Item = 0x28C8~Skyrim.esm|ActorTypeNPC|NONE|1/9|-S/-C/-D|1|55
Item = 0x28C5~Skyrim.esm|ActorTypeNPC|NONE|10/17|-S/-C/-D|1|55
Item = 0x28C6~Skyrim.esm|ActorTypeNPC|NONE|18/27|-S/-C/-D|1|55
Item = 0x28C7~Skyrim.esm|ActorTypeNPC|NONE|28/37|-S/-C/-D|1|55
Item = 0x28C9~Skyrim.esm|ActorTypeNPC|NONE|38|-S/-C/-D|1|55

; --- Restore Mana: _NNE_Manatrank (5 tiers) ---
Item = 0x28DB~Skyrim.esm|ActorTypeNPC|NONE|1/9|-S/-C/-D|1|45
Item = 0x19E3B~Skyrim.esm|ActorTypeNPC|NONE|10/17|-S/-C/-D|1|45
Item = 0x90892~Skyrim.esm|ActorTypeNPC|NONE|18/27|-S/-C/-D|1|45
Item = 0x9B6CB~Skyrim.esm|ActorTypeNPC|NONE|28/37|-S/-C/-D|1|45
Item = 0x1037F7~Skyrim.esm|ActorTypeNPC|NONE|38|-S/-C/-D|1|45

; --- Restore Stamina: _NNE_Morgenlufttrank (5 tiers) ---
; NOTE: Morgenlufttrank ("Morning Air Potion") is the RESTORE-stamina line.
; _NNE_Ausdauertrank is FORTIFY stamina and has only 2 tiers in base Enderal.
Item = 0x28DE~Skyrim.esm|ActorTypeNPC|NONE|1/9|-S/-C/-D|1|45
Item = 0x85668~Skyrim.esm|ActorTypeNPC|NONE|10/17|-S/-C/-D|1|45
Item = 0x9B6CA~Skyrim.esm|ActorTypeNPC|NONE|18/27|-S/-C/-D|1|45
Item = 0x1037F5~Skyrim.esm|ActorTypeNPC|NONE|28/37|-S/-C/-D|1|45
Item = 0x1037F6~Skyrim.esm|ActorTypeNPC|NONE|38|-S/-C/-D|1|45

; --- Ambrosia: _00E_Ambrosia, -20% Arcane Fever. Rare loot, no level band. ---
;
; DeathItem, not Item, and this line HAS A HARD DEPENDENCY ON A SETTING OUTSIDE
; THIS FILE. Both facts were paid for in-game on 2026-08-14; read before editing.
;
; 1. "NPCs Use Potions" ships [Removal] RemoveItemsOnDeath=true,
;    ChanceToRemoveItem=90, MaxItemsLeftAfterRemoval=2 - it culls every corpse's
;    alchemy items to at most 2 survivors, each having first failed a 90% removal
;    roll. A single-count item loses that lottery against the potions above it
;    essentially always (there were up to 6 of them when this was measured; the
;    counts have since been cut to 1 each, so up to 3, which does not change the
;    conclusion). Distributed at chance 100 to EVERY humanoid base in the
;    game, Ambrosia still reached ZERO corpses. SPID was never at fault: the log
;    showed it distributing correctly the whole time. This line only works with
;    NUP's RemoveItemsOnDeath = false (or heavily loosened); restore NUP's stock
;    90/2 and Ambrosia becomes unobtainable again with nothing to indicate why.
;
; 2. Item = could not be rescued by raising its chance, because NUP removes the
;    item AFTER distribution. DeathItem fires on TESDeathEvent so it lands on the
;    corpse rather than in a living NPC's pack - correct anyway, since Ambrosia
;    cures Arcane Fever, which NPCs do not have. It also rolls PER CORPSE instead
;    of per base record, which retires the all-or-nothing behaviour that made a
;    low Item = chance read as "never drops".
;
; 10 = roughly one Ambrosia per ten kills, verified end to end at chance 100 first.
DeathItem = 0xFEC69~Skyrim.esm|ActorTypeNPC|NONE|NONE|-S/-C/-D|1|10
