[General]
; A second One Click Power Attack key, next to the one set in OCPA's MCM (iKeycode in OCPA.ini).
; Pressing it power attacks exactly as OCPA's key does, with OCPA's own rules: modifier key,
; "only during attack", zero stamina and MCO queueing are all read from OCPA's settings.
;
; Key codes are OCPA's: keyboard = DX scan code, mouse = 256 + button (Mouse 4 = 259),
; gamepad = 266-281 (LB 274, RB 275, LT 280, RT 281). -1 turns it off.
; If this is the same key as OCPA's, the plugin does nothing.
iKeycode=281

; Log each press of the second key to ZenOCPASecondKey.log.
bLog=1
