Description:
  TargetLanguage: English
  Value: Every two light attacks that hit an enemy light a mote of runic light on one of the four knuckles. Once all four are lit, the next power attack spends 20 Mana to call beams of light down from the sky on up to 4 enemies around you, 80 damage to Health and 40 to Stamina and Magicka each, and each beam scatters 4 orbs of runic light that strike the enemies in their path for 15. Undead take double damage.
