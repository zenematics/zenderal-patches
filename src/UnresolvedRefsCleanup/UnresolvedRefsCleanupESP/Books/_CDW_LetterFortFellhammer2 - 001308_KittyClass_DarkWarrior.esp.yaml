BookText:
  TargetLanguage: English
  Value: >-
    <font face="$HandwrittenFont">

    To V and others-


    I fear that in the past week, I have once again been pursued by the type who love playing hero. As such, I believe this is the perfect moment to execute my plan regarding the orcs of Narzulbur, who sit idle upon a trove of rare mineral.


    Our agents will use my charm enchantment to rouse the giants into a frenzy and direct them to lay waste to the stronghold. After the orcs are eliminated, I will contact you so we can swiftly purchase the mining rights from Eastmarch. They cannot refuse, for they rely on our iron supplies to wage their war.


    -Mist
