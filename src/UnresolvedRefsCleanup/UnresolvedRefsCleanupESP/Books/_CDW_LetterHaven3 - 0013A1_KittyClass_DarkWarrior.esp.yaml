BookText:
  TargetLanguage: English
  Value: >-
    <font face="$HandwrittenFont">

    Nothing aches my heart more than the realization that many with some kind of conscience still walk this earth. I despise their kind and everything about them.


    They imagine us weak, that the strength of spirits can only come from the pursuit of righteous justice. It is self-absorbed arrogance of the highest order.


    I am not blind, nor am I weak. I am simply unafraid of my own ambitions, unlike those children who have yet to realize that empathy is a weakness and virtue is a cage.


    I'm interested in investing in rulers who seek to nurture a society that puts such people under everyone else, where they belong. And by the Nine, I would pay a heavy sum to see such people crumble under their own weight and be tormented into despair.


    I presume you will be able to grant me my wish in exchange for my assistance?


    -Brand
