BookText:
  TargetLanguage: English
  Value: >-
    Let it be known that strange happenings plague the road north of Ivarstead.


    Iron Hollow Mine may have fallen under some kind of magical influence. Those who pass by the old mining road speak of unnatural glows emanating from the entrance at night.


    Some speak of travelers who set out toward the mine and never returned. Their horses were found wandering the road but the riders had vanished without a trace.


    The Jarl's men have been notified, but with the war consuming their attention, no investigation has been mounted.


    Travel at your own risk. Keep to the main road. Do not approach the mine after dark.
