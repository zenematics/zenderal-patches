BookText:
  TargetLanguage: English
  Value: >-
    <font face="$HandwrittenFont">

    To V and others-


    I am residing within the halls of Fellhammer Keep for the time being. This mine here will dry up one day, and what then? The unsavory rabble bound by contract will be freed. I say it is a waste of assets and potential.


    My charm enchantment, placed upon the Iron Hollow Mine north of Ivarstead a decade ago, still functions like new. It continues to lure in passing travelers to dig, requiring only a handful of my mercenaries to sustain the operation. I would say that our venture there has proved far more profitable than our efforts here.


    Through your efforts to seed nationalistic propaganda throughout the land and its culture, the people of Skyrim remain desperate and blind. Let me ask - what better time than now to expand our business? The authorities are consumed by war and foreign affairs while bandits roam the roads with leisure. There is no one with a conscience patrolling the wilderness to notice our operations in this era of strife.


    -Mist
