    <font face="$HandwrittenFont">

    Skyrim is ripe with opportunities thanks to the Civil War and foreign influences. This instability has given rise to two kinds of people: those desperate for the victory of their kind, and those desperate for coin.


    Such groups dwell in Eastmarch as well. One faction seeks to drive the elves from their homes. Another faction will do anything for gold and connections. I assume you can see this is an arrangement waiting to be made.


    Be swift and discreet, or risk other players joining the fray and claiming our share of the profit.


