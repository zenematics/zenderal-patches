Description:
  TargetLanguage: English
  Value: Sets the enemy ablaze, 5 fire damage a second for 6 seconds. Its cracks start cold, and every two light attacks that hit an enemy fill more of them with molten fire. Once it is full, your next power attack, hit or miss, spends 20 Mana and splits the ground before you, under the enemy you swing at. A ring of fire bursts out, 22.5 fire damage plus 0.45 for every point of Elementalism to every enemy within it, and a volcano erupts there for 6 seconds, raining lava bombs that strike for 7.5 fire damage plus 0.19 for every point of Elementalism, and smaller volcanoes break open round it.
