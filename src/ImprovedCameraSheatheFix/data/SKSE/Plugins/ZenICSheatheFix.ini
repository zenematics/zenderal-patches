[General]
; always = keep Improved Camera's first-person eye-height raise with the weapon drawn too
; never  = never apply it
; off    = leave Improved Camera alone
Mode=always

; 1 = head bob also follows the head with a weapon drawn (when Improved Camera's Head Bob > Combat
;     is ticked), so turning head bob on no longer makes the camera jump when a sheathe ends
CombatHeadbob=1

; 1 = log camera/eye/head heights for 90 frames after each weapon-state change
;     to My Games\Skyrim Special Edition\SKSE\ZenICSheatheFix.log
Debug=0
