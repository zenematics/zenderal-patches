[General]
; Ends a player block that outlives its key. Dual Wield Parrying SKSE ignores the key-up when it
; arrives mid-stagger, mid-sheathe, with controls disabled or while IsBlocking briefly reads false,
; which leaves the character blocking until the key is tapped again.
; The block keys watched are Dual Wield Parrying's ParryKey/ParryKey2 (read from its own ini) plus
; the vanilla Left/Right Attack/Block controls on every device.

; How long (ms) after the last block key is released before a block that is still on is ended.
; Dual Wield Parrying's own blockStop normally lands within a frame, so this only catches lost ones.
GraceMs=200

; 1 = log every block it ends to My Games\Skyrim Special Edition\SKSE\ZenBlockReleaseFix.log
Log=1
