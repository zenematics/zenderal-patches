[Muskets]
; Plugins whose crossbow-type weapons count as muskets (comma-separated). Bows and other crossbows are
; never affected.
Plugins=OrdoLegionisMuskets.esp

[Dodge]
; After a musket shot, the dodge stays blocked this long (ms) so it cannot cut the reload short.
; DAR Rifles' musket fire+reload clip runs 2400 ms, the shot itself lands ~130 ms in.
LockAfterShotMs=2300

; After LockAfterShotMs the dodge stays blocked while the musket is still firing/reloading (the
; list lets a dodge cancel attacks, which is what skipped the reload), but never longer than this.
MaxLockMs=5000

; Animation events that count as a dodge (prefixes, comma-separated). TK Dodge sends TKDodgeForward,
; TKDodgeBack, TKDodgeLeft and TKDodgeRight.
BlockedEvents=TKDodge

[Aim]
; SpeedMult taken away while a musket is raised or aimed (100 = normal speed, so 35 = 65% speed).
; 0 turns the slowdown off.
SpeedMultPenalty=35

[Reload]
; 1 = reload on demand: a shot leaves the musket empty, and the next attack press plays the reload instead of
; firing (pair with Zenderal - Musket Ramrod Reload's shot-only clips; with shot clips that also reload, the
; reload would play twice). 0 = the engine's way: the shot clip is the reload.
OnDemand=1

; The animation event the engine sends for the attack press (dropped while the musket is empty, prefixes,
; comma-separated), the one sent instead to start the reload, and the reload clip's event that loads the musket.
AttackEvents=crossbowAttackStart
ReloadEvent=reloadStart
LoadedEvent=reloadStop

[General]
; 1 = log each musket shot and each blocked dodge to
; My Games\Skyrim Special Edition\SKSE\ZenMusketHandling.log
Log=1
