; Zenderal fork of Precision 2.0.6 - frost atronach active-ragdoll fixes (ported from adamhynek's PLANCK)
; and unarmed attacks that reach small creatures.
; Read once at startup. Each switch is independent; see src/PrecisionFork in zenderal-patches.
[RagdollFixes]
; offset bhkRigidBodyT bodies when Precision drives the ragdoll to the animation pose
bApplyRigidBodyTWhenWriting = true
; remove the offset when the ragdoll pose is read back into the animation
bApplyRigidBodyTWhenReading = true
; let stretched animation limbs map onto the ragdoll unclamped (only for ragdolls with bhkRigidBodyT bodies)
bDontRestrictBoneLengthsAnimToRagdoll = false

[UnarmedReach]
; unarmed hand/forearm attack capsules get a second capsule hanging straight down from the fist, so punches hit
; rats, wolves and other small creatures they pass over (humanoid attackers only; ground and objects are never hit)
bEnable = true
; radius of that capsule in game units (x the attacker's scale)
fRadius = 15.0
; it only hits actors at most this tall, as a fraction of the attacker's height, so humanoid fist fights are unchanged
fMaxTargetHeightRatio = 0.8
; write each reach capsule and each target it hits or ignores (with both heights) to Precision.log
bLog = true
