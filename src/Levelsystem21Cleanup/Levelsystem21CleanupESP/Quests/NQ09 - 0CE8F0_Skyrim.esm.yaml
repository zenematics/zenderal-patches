- Index: 35
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: 'Sillas showed me a casket which most likely washed up at the beach near Riverville - instead of the anticipated "treasure" there only was a note in it, which gravely disappointed him. That note showed me the way to a stone tablet at an old shrine on which another riddle was engraved: "At the beginning of the current, a big stone with a raised bleak tree in the West. "'
