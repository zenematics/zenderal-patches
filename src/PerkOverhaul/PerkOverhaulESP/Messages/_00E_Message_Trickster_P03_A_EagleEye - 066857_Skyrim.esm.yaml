      String: Gli attacchi caricati sfruttano il vigore. Quando la barra del vigore lampeggia, ogni attacco caricato eseguito diventa un attacco normale.
    - Language: Polish
      String: Potężne ataki zużywają kondycję. Jeśli pasek kondycji miga, zamiast potężnego ataku zostanie wyprowadzony atak zwykły.
    - Language: Russian
      String: Силовые атаки понижают запас сил. Если индикатор запаса сил мигает, любая силовая атака становится обычной.
    - Language: French
      String: Les attaques de puissance consomment de la vigueur. Lorsque la jauge de vigueur clignote, toute tentative d'attaque de puissance se transforme en attaque normale.
    - Language: Japanese
