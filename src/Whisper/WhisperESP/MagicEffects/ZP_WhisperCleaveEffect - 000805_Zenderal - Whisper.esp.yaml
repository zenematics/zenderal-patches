Description:
  TargetLanguage: English
  Value: While Whisper is in hand, each Entropy spell that strikes an enemy pulls its soul into the axe, and its eyes glow brighter with each. With 5 souls the crystal blazes, and the next power attack releases them as a wave of purple light that cleaves through every enemy before you for 80 magic damage. An enemy the wave kills rises as a Soul Wisp that fights at your side for 30 seconds, one at a time; strike it with an Entropy spell and it bursts, lowering the magic resistance of nearby enemies by 15% and restoring 30 Magicka.
