; Zenderal - DBVO Player Lip Sync (ZenDBVOLipSync.dll)
; Plays the .lip track inside each DBVO .fuz on the player's mouth while the line plays.
[General]
; Shift the mouth against the voice, in milliseconds. Positive = mouth later, negative = earlier.
OffsetMs=0
; Mouth movement, percent of the recording's own weights.
Strength=100
; .lip frame rate. The tracks are 30 fps; only change this if you also change DBVO's dialogue pitch
; (pitch 110 plays 10% faster: use 33).
FrameRate=30
; Voice pack folder under Data/Sound/DBVO. Blank searches every folder for the line.
VoicePack=
; Write ZenDBVOLipSync.log lines for every player line.
Log=1
