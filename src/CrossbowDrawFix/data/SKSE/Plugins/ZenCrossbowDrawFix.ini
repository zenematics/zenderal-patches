[General]
; Ends a crossbow draw that leaves the player stuck "bolt attached": no sprinting and no sheathing
; until a shot. Happens when a draw is cut short (drawing right after sprinting), because the event
; that normally ends the draw never fires.

; How long (ms) a drawn crossbow may stay "bolt attached" after a DRAW before it is reset. A normal
; draw clears itself in ~890 ms, so keep this just above that.
DrawHoldMs=1000

; The same after a RELOAD (after a shot). A normal reload takes ~1600 ms.
HoldMs=2500

; 1 = log every reset to My Games\Skyrim Special Edition\SKSE\ZenCrossbowDrawFix.log
Log=1
