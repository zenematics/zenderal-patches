[General]
; auto = pick 16x9 / 21x9 / 32x9 from the primary monitor. Or force one of them.
Layout = auto
; 1 = write SSEDisplayTweaks_custom.ini with the monitor's resolution at every launch. 0 = leave the resolution alone.
AutoResolution = 1
; 1 = mark the game DPI-aware, so Windows display scaling above 100% (the default on 4K screens) does not stretch
;     the game window. 0 = leave it to Windows.
DpiAware = 1
