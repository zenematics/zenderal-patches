[General]
; Makes controlmap gamepad combos work on SSE 1.5.97. The engine ignores a combo's modifier, so a
; button bound alone AND as the second key of a combo fires the wrong event: with Complete Controller
; Setup, LB sheathes instead of attacking with the left hand (A+LB = Ready Weapon) and D-pad Down alone
; opens the map (B + D-pad Down = Quick Map). This picks, on every press, the combo whose modifier is
; held, else the plain binding. Bindings are read from controlmap.txt and ControlMap_Custom.txt.

; 0 = do nothing
Enabled=1

; 1 = log the bindings it found to My Games\Skyrim Special Edition\SKSE\ZenGamepadCombos.log
Log=1

; 1 = also log every press of a button that has a combo, with the buttons held and the event chosen
LogPresses=1

; 1 = rewrite each press's user event from the held buttons. OFF: the engine already resolves combos
; correctly (1.0.1 log, A+LB arrived as Ready Weapon); 1.0.0/1.0.1's rewrite broke A+LB.
Rewrite=0

; 1 = log every draw/sheathe animation event sent to the player, with the call stack (module+offset),
; to find what sheathes the weapon on LB
TraceGraph=1
