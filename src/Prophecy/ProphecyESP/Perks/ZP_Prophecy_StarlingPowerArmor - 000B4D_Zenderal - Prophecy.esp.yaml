  TargetLanguage: English
  Value: 'Grants the "Starling Power Armor" power: call a gilded Starling war machine to your side. It follows you and fights for you, and activating it lets you climb in and pilot it for 3 minutes: attack with either arm, hold Activate to put your weight behind every blow - the left arm then bursts in a shock nova, and lightning chains from whoever the right arm strikes - hold Shout to breathe steam or an element chosen with the Favorites key, and hold the Tween Menu key to fly. Afterwards it needs 5 minutes to cool. Use the power again to recall the armor, or to climb out; sneak and activate it to dismiss it.'
