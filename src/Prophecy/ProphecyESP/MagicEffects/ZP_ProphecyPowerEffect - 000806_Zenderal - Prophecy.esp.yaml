    - MutagenObjectType: ScriptStringListProperty
      Name: Descriptions
      Data:
      - "Grants the \"Consecrate Dead\" spell: cast it on a corpse to burn it to ash with holy light and restore 30 Health, Mana and Stamina. Undead it strikes take 15 damage and stagger."
      - "Your Light Magic skill is increased by 10."
      - "Your maximum Mana is increased by 25."
      - "While you block with a spell or nothing in your left hand, a ward of sunlight surrounds you: you gain 25% resistance to magic and immunity to disease, and each attacker you block is struck by a beam of light that leaps between enemies for 20 damage, for 10 Mana (with less, you simply block)."
      - "Your maximum Health is increased by 25."
      - "Your hits with silver weapons have a 15% chance to call down a pillar of holy light on the target: 40 damage, while beams of light strike the enemies around it for 10 each. Undead take double damage."
      - "Your Health regenerates 25 percent faster."
      - "You gain 10% resistance to magic."
      - "Grants the \"Wrath of the Lightborn\" spell (no Mana, 50% Arcane Fever): for 60 seconds, bolts of sunlight strike enemies within 20 feet of you for 40 damage each. Undead take double damage. It cannot be cast at 50% Arcane Fever or more."
      - "Once every 90 seconds, dropping below 25% Health makes you immune to damage for 6 seconds, then heals you for 100 Health."
      - "Your Mana regenerates 10 percent faster."
      - "You reload muskets 30% faster."
      - "Your Archery skill is increased by 10."
      - "Your maximum Stamina is increased by 25."
      - "Your musket hits deal 10 extra fire damage."
      - "Your Stamina regenerates 25 percent faster."
      - "Your musket hits make living targets bleed for 50 damage over 5 seconds."
      - "Your armor rating is increased by 40."
      - "Your pistol shots have a 25% chance to ricochet off their target into another enemy up to 45 feet away, hitting it with the same shot."
      - "You move at full speed while aiming a musket."
      - "Your carry weight is increased by 25."
      - "Your maximum Health is increased by 25."
      - "A musket shot at a target you haven't shot in the last 10 seconds is a critical strike that deals triple critical damage, and its weapon enchantments are twice as strong."
      - "Grants the \"Explosive Tripwire\" power: at will, set a tripwire in front of you that lasts 120 seconds. When tripped, it snaps and knocks everyone it hits to the ground, and an enemy who trips it sets off an explosion that deals 40 damage."
      - "Your Handicraft skill is increased by 10."
      - "Your carry weight is increased by 30."
      - "Grants the \"Smokescreen\" power: once a day, create a 35-foot cloud of smoke for 180 seconds and turn invisible for 10 seconds. Those inside the cloud are blinded and cannot see sneaking targets, and your sneak attacks against them deal 50% more damage."
      - "You gain 15% resistance to poison."
      - "Your Smokescreen cloud also blinds automatons: mechanical spiders, spheres and centurions inside it can no longer see you."
      - "Grants the \"Utility Droid\" power: throw out a mechanical spider that follows you, heals you and staggers enemies around it. It lasts until destroyed, and using the power again calls it back to you. Your first droid is free; each new one costs 10 Spare Parts."
      - "Your armor rating is increased by 40."
      - "You can build Clockwork Turrets at a forge, and you receive one when you learn this. The \"Clockwork Turret\" power deploys it for 30 seconds: it turns and fires at your target, or the nearest enemy in combat, dealing damage equal to 30% of your Handicraft skill."
      - "You gain 15% resistance to lightning."
      - "Your maximum Stamina is increased by 25."
      - "Your Clockwork Turret power deploys two turrets side by side, and they fire 2% faster with every shot, up to 200%."
      - "Darkness gathers in you while you stand in shadow, up to 10: the darker it is, the faster. In light it slowly fades. Your Shadow talents spend Darkness instead of Mana. Grants the \"Gather Shadows\" spell (3 Darkness): for 60 seconds, your melee attacks and Shadow spells are up to 50% stronger in darkness."
      - "Your Sneak skill is increased by 10."
      - "Your maximum Mana is increased by 25."
      - "Grants the \"Draining Shroud\" spell (4 Darkness): for 60 seconds, you absorb 10 Health and Mana per second from nearby enemies."
      - "Your Mana regenerates 10 percent faster."
      - "Grants the \"Nightblade\" spell (4 Darkness): for 60 seconds, your power attacks can reach targets up to 50 feet away, dashing you to them for 45 magic damage. Each dash spends half your Darkness, dealing 15 more magic damage per point spent."
      - "Your One-handed skill is increased by 10."
      - "While you sneak, your body is wrapped in black and grey mist, you are 50% harder to detect, and Darkness gathers twice as fast."
      - "Grants the \"Darkness\" spell (2 Darkness): a bolt that leaves a pool of black mist and darkness where it strikes for 30 seconds."
      - "Grants the \"Pull Through Shadows\" spell (3 Darkness): pull a target up to 150 feet away to you, lowering its armor by 100 for 10 seconds."
      - "Your Psionics skill is increased by 10."
      - "Your Sneak skill is increased by 10."
      - "Grants the \"Nightfall\" power (a full Darkness meter): for 60 seconds, a pool of darkness follows you and every Shadow spell you know is cast on you at once."
      - "Your unarmed attacks deal extra damage equal to 15% of your current Stamina. Requires both hands to be empty."
      - "Your maximum Stamina is increased by 25."
      - "Your unarmed attacks deal 5 more damage."
      - "Choose a damage type (fire, frost, shock, poison, disease or sun): your unarmed attacks unleash a shockwave that deals it to everyone in front of you. Requires both hands to be empty, and does not trigger while sneaking."
      - "Your Stamina regenerates 25 percent faster."
      - "Every 5th unarmed hit unleashes fire, frost or lightning on the enemy, at random: a fireball explosion, a freeze that holds it for 4 seconds, or chain lightning that leaps to nearby enemies. Each deals 60 damage."
      - "Your unarmed attacks have a 15% chance to stagger enemies, and deal 25% more damage to staggered enemies."
      - "Your armor rating is increased by 40."
      - "Your unarmed attacks have a 15% chance to land a critical strike that deals damage equal to 40% of your current Stamina. Requires both hands to be empty."
      - "Your maximum Health is increased by 25."
      - "You gain 10% resistance to magic."
      - "Dodging in combat briefly slows time to a crawl (once every 8 seconds) and releases a Shock Nova that deals 40 shock damage to nearby enemies and sends chain lightning into your foe (once every 8 seconds)."
      - "Grants the \"Seismic Stomp\" power: stomp the ground to send out a shockwave that hurls every enemy within 19 feet into the air and makes them bleed for 50 damage over 5 seconds, while time briefly slows. Usable once every 30 seconds."
      - "Your maximum Health is increased by 25."
      - "Your Blocking skill is increased by 10."
      - "While you are at or below half Health, every hit you take restores 20 Stamina."
      - "Your armor rating is increased by 60."
      - "You gain 25% resistance to fire, frost and lightning."
      - "Your maximum Stamina is increased by 25."
      - "While 3 or more enemies are near you, you regenerate 2 Stamina per second."
      - "Your One-handed and Two-handed skills are increased by 10."
      - "Your Health regenerates 25 percent faster."
      - "Grants the \"War Banner\" power: plant a banner for 15 seconds. While you stand near it, you heal 20 Health per second, and enemies who come close are bound in chains, as by a Stave of Binding. Usable once every 5 minutes."
      - "Rage builds as you fight: every melee hit you land and every hit you take adds a stack, up to 10. Each stack makes your attacks 2% stronger. After 6 seconds without a hit, Rage fades by one stack every 3 seconds, and it is gone when combat ends."
      - "Your maximum Health is increased by 25."
      - "Your maximum Stamina is increased by 25."
      - "Your sprinting power attacks with at least 8 Rage tear a burning line through the ground: 80 damage to everyone in it, 4 more per second for 10 seconds, and a stagger. Spends 8 Rage."
      - "Your One-handed and Two-handed skills are increased by 10."
      - "Your forward power attacks with at least 6 Rage send a wave of darkness in a straight line: 40 damage, and 20 more to targets further away. Spends 6 Rage."
      - "Your backward power attacks with at least 6 Rage pierce the target for 40 damage and lower its magic resistance by 25% for 30 seconds. Spends 6 Rage."
      - "Your standing power attacks with at least 8 Rage raise a pillar of dark fire: 60 damage, knocking down everyone it strikes. Spends 8 Rage."
      - "Your armor rating is increased by 40."
      - "Your sideways power attacks with at least 6 Rage drain 40 Health from the target into you. Spends 6 Rage."
      - "Your Health regenerates 25 percent faster."
      - "Your sideways power attacks with at least 6 Rage drain 40 Mana and 40 Stamina from the target into you. With Bloodletter, one hit does both for one cost. Spends 6 Rage."
      - "Your Rage can reach 15 stacks, and fades half as fast."
      - "Your Stamina regenerates 25 percent faster."
      - "When your Rage reaches its peak you enter Vehemence for 15 seconds: your power attacks cost no Stamina, and their Rage actions spend no Rage. When it ends, your Rage is spent."
      - "Grants the \"Druidcraft\" spell: cast it on a corpse and nature reclaims it, growing a plant you can harvest, and you heal 20 Health and gather a Goodberry."
      - "Your Mana regenerates 10 percent faster."
      - "Your armor rating is increased by 40."
      - "Grants \"The Hunt\" power: spend 5 Goodberries to call a Gray Wolf to your side. It stays until it is killed."
      - "The Hunt calls two Gray Wolves instead of one."
      - "Your Health regenerates 25 percent faster."
      - "Grants the \"Bramble Growth\" spell: a bed of brambles that deals 10 bleed and poison damage for 15 seconds. A target that dies on it sprouts a Goodberry."
      - "Grants the \"Twister\" spell (97 Mana): a column of deadly wind that deals 40 damage per second for 10 seconds and staggers those caught in it."
      - "Grants the \"Create Water Totem\" spell: a totem stands for 60 seconds, heals 5 Health and Mana per second and cures disease. An Elementalism spell."
      - "Your maximum Mana is increased by 25."
      - "Grants the \"Create Tree Totem\" spell: a totem stands for 60 seconds and deals 10 poison damage per second to nearby enemies in combat. An Elementalism spell."
      - "Your armor rating is increased by 40."
      - "You can have one more totem standing at a time."
      - "Grants the \"Create Earth Totem\" spell: a totem stands for 60 seconds and casts tremors that deal 120 damage every 7 seconds in combat. An Elementalism spell."
      - "Your maximum Mana is increased by 25."
      - "Grants the \"Force of Nature\" power (no Mana, 50% Arcane Fever): for 60 seconds you take the form of a Horned Lord, whose power attacks steal Mana, and a raven, a snow leopard and two rattlesnakes fight at your side until they are killed or the form ends. It cannot be used when the fever would reach 100%."
      - "Grants the \"Arcane Arsenal\" power: choose Fire, Frost or Lightning, and your bow hits deal 10 extra damage of that element."
      - "Your maximum Mana is increased by 25."
      - "Your Archery skill is increased by 10."
      - "While you aim a bow, a Spell Ward (Rank II) surrounds you. It fades when you fire or lower the bow."
      - "Your Mana regenerates 10 percent faster."
      - "Grants the \"Ice Shot\" talent (110 seconds cooldown): with a bow equipped, add 3 ice arrows to your quiver. They deal 25 frost damage and freeze a weak target - no higher level than you, never a unique foe - solid for 8 seconds, and your next arrow shatters it."
      - "You gain 15% resistance to frost."
      - "Your bow hits send a barn owl to attack the target. It fights at your side until it is killed, each later hit sends it after that target, and each of its strikes drains 10 Magicka from its target and gives it to you. While it is out, you regenerate 2 Magicka per second. Only one owl can be out at a time."
      - "Your maximum Stamina is increased by 25."
      - "You gain 10% resistance to magic."
      - "Grants the \"Arcane Echo\" power: use it while dual casting a spell to store that spell. Your fully drawn bow shots in combat then also release the stored spell toward your crosshair. Only works with spells cast at others."
      - "You can command one more summon for every 25% Arcane Fever you have."
      - "Your Entropy skill is increased by 10."
      - "Your maximum Mana is increased by 25."
      - "Grants the \"Dark Effigy\" spell (100 Magicka): raise a dark totem for 60 seconds. You and your undead summons near it heal 2 Health per second, and you and your allies near it gain 250 armor."
      - "You gain 15% resistance to poison."
      - "Grants the \"A Willing Sacrifice\" power: every summon you command explodes, dealing damage equal to half its maximum Health to each enemy within 14 feet of it. Usable once every 15 seconds."
      - "Your Mana regenerates 10 percent faster."
      - "A Willing Sacrifice restores 50 Magicka for every enemy it hits."
      - "You gain 15% resistance to frost."
      - "Your armor rating is increased by 40."
      - "Grants the \"Legion of the Damned\" power: at the cost of 50% Arcane Fever, raise six skeletons (two warriors, two archers and two mages) that fight at your side for 5 minutes. They do not count against your summon limit, and A Willing Sacrifice can explode them. A new Legion replaces the old one."
      - "Grants the \"Blink Step\" lesser power (35 Mana): you shatter like glass and re-form up to 33 feet ahead."
      - "Your Elementalism skill is increased by 10."
      - "Your maximum Mana is increased by 75."
      - "While you cast a spell, five glass wards orbit you. Each absorbs one whole weapon, arrow or claw hit, then breaks. They fall away when you stop casting."
      - "You gain 15% resistance to fire."
      - "Grants the \"Frost Spires\" spell: spires of ice burst from the ground, dealing 30 damage to Health and Stamina - up to four times that the more spires strike - and staggering."
      - "You gain 15% resistance to frost."
      - "Grants the \"Drowning Orb\" spell: a 15-foot sphere of water slows everyone inside it and drains 30 Stamina and Mana per second. Each enemy inside it gives you 10 of its Mana per second, and you restore 10 Mana per second while you stand in it. An Elementalism spell: water is frost, so Elementalist talents strengthen it."
      - "Grants the \"Wildfire\" spell: a bolt of flame strikes for 40 damage and leaves a fire that chases your targets for 10 seconds, burning 12 damage each time it catches them."
      - "Grants the \"Starlance\" spell: beams of pure Mana fall from the night sky on a single target for 80 damage."
      - "You gain 15% resistance to lightning."
      - "Grants the \"Twin Effigies\" spell: two copies of you, one on each side, draw your enemies' attacks for 30 seconds and hurl chain lightning at them every 6 seconds, 40 damage a bolt. Each shatters after taking a third of your Health in damage. They grow with your Psionics: at 50 they last 40 seconds and take almost half your Health, at 75 50 seconds and two thirds, at 100 a full minute and more than your whole Health."
      - "Grants the \"Gravity Well\" spell: a well of gravity pulls nearby enemies into it and staggers them, and drains 20 Health from each into you."
      - "Grants the \"Falling Star\" spell: a falling star strikes for 60 damage and staggers; a target with more Mana than Health also loses Mana."
      - "Your Mana regenerates 10 percent faster."
      - "Grants the \"Veil Wyrm\" shout, all three words: a wyrm of glass forms over your shoulder and roars. Its shockwaves cut and stagger every enemy around you and slow time; two words bring a Veilblade - a copy of you with your weapons - out of the burst to fight for you, three words two of them and throw your enemies back, and you vanish in the shards for 10 seconds. Then blue flames of Mana burn around you for 20 seconds: your spells cost half as much Mana and you restore 10 Mana per second. One word recovers in 40 seconds, two in 70, three in 100."
