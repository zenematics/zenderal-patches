[General]
; Keeps Cinematic Conversation Camera out of Enderal's first-person memory scenes: the childhood
; memory at the start (the player shrunk to a child, talking to Daddy) and the scenes where the
; player has no body. While any condition below holds, the normal first-person dialogue camera is
; used. CCC films again the moment the player is back to normal.

; The player's scale below this percentage counts as "a child". Enderal's childhood memory uses 85;
; a normal player is 100.
ScaleBelowPct=90

; The player's alpha below this percentage counts as "no body". Enderal hides the player with 0
; (visions, the class-menu origin, the Myrad flight) and fades them to 10 or 50 in a few ghostly
; scenes. 99 catches all of them; set 1 to catch only fully invisible scenes.
AlphaBelowPct=99

; 1 = also stand down while the player's race is flagged as a child race.
ChildRace=1

; 1 = log every hold and release to My Games\Skyrim Special Edition\SKSE\ZenCCCStandDown.log
Log=1
