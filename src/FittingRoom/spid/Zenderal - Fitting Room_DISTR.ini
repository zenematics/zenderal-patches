; Zenderal - Fitting Room: the Seamstone, sold in Enderal.
;
; Fitting Room (Nexus 185342) ships FittingRoomLore.esp with one lore item, The Seamstone
; (MISC 0x805): a carryable Alteration focus that opens the editor when used (Wheeler can
; slot it), is the key to the editor under bRequireSeamstone=1, and pays for restyles under
; iCostMode=2. Nothing in the plugin places or sells it: FittingRoom.dll stocks it onto
; Skyrim's Farengar Secret-Fire by FormID (NPC 0x13BBB, his ACHR 0x1A67E, faction 0xABB43
; in Skyrim.esm), and none of those forms exist in Enderal's Skyrim.esm, so in this list
; the stone could never be bought.
;
; One Seamstone each to Enderal's two magic merchants whose vendor lists accept the stone's
; VendorItemSoulGem keyword (VendorItemsSpells 0937A1 / VendorMagicStuff 0E7621):
;   Gabrielle Emberlord  _00E_CapitalCity_GabrielleFunkenfrst 0A1A2C  Ark, the magic shop
;   Tarhutie Leklerk     _00E_Flusshaim_Merchant_Tarhutie     0151C8  Riverville
; SPID adds Item= entries to the NPC BASE container every session (not to the actor), so a
; bought stone stays bought: the actor's own inventory delta cancels the base's one copy.
; Form filters, not EditorIDs: an NPC EditorID filter needs po3_Tweaks' hook and these two
; forms are unambiguous.
Item = 0x805~FittingRoomLore.esp|NONE|0xA1A2C~Skyrim.esm|NONE|NONE|1|100
Item = 0x805~FittingRoomLore.esp|NONE|0x151C8~Skyrim.esm|NONE|NONE|1|100
